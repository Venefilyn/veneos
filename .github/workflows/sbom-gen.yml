---
name: Generate SBOMs
on: # yamllint disable-line rule:truthy rule:comments
  workflow_call:
    inputs:
      image:
        type: string
      variant:
        type: string
      digest:
        type: string
    secrets:
      SIGNING_SECRET:
        required: true

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  SET_X: 1

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref
    || github.run_id }}-${{ inputs.image }}-sbom
  cancel-in-progress: true

jobs:
  get-variants:
    name: Get Images for Build
    permissions:
      actions: read
    outputs:
      variants: ${{ steps.variants.outputs.variants }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Just
        # yamllint disable-line rule:line-length rule:comments
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Get variants
        id: variants
        shell: bash
        run: |
          just=$(which just)

          echo "variants=$(sudo $just image-flavors "${{ inputs.image }}" | jq --compact-output)" >> "$GITHUB_OUTPUT"

  sbom-image:
    name: SBOM for ${{ inputs.image }}:${{ matrix.variant }}
    needs: get-variants
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        variant: ["${{ fromJson(needs.get-variants.outputs.variants) }}"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install Just
        # yamllint disable-line rule:line-length rule:comments
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Check Just Syntax
        shell: bash
        run: |
          just --version
          just check

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        # https://github.com/containers/container-libs/issues/388
        with:
          cosign-release: 'v3.1.3'

      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Prepare environment
        env:
          IMAGE_NAME: ${{ inputs.image }}
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Setup Syft
        id: setup-syft
        if: inputs.publish
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate SBOM
        id: generate-sbom
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ matrix.variant }}
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        run: |
          $(command -v just) sbom-gen \
            --image "${MATRIX_BASE_NAME}" \
            --tag "${MATRIX_STREAM_NAME}" \
            "${SYFT_CMD}"

      - name: Upload SBOM
        id: upload-sbom
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.pre-push.outputs.digest }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          SBOM="sbom_out/${IMAGE_NAME}/sbom.json"

          cd "$(dirname "${SBOM}")"
          oras attach \
          --artifact-type application/vnd.spdx+json \
          --annotation filename=$(basename "$SBOM") \
          "${IMAGE}@${DIGEST}" \
          "$(basename ${SBOM})"

          sbom_digest=$(oras discover --format json "${IMAGE}@${DIGEST}" | jq -r '.referrers[] | select(.artifactType == "application/vnd.spdx+json") | .digest')

          echo "sbom_digest=${sbom_digest}" >> $GITHUB_OUTPUT

      - name: Sign SBOM OCI Artifact
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SBOM_DIGEST: ${{ steps.upload-sbom.outputs.sbom_digest }}
        run: |
          cosign sign -y --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${SBOM_DIGEST}

      - name: Attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.pre-push.outputs.digest }}
          # Keep this disabled, this confuses cosign verify
          push-to-registry: false

  check:
    name: Check Gen SBOM Successful
    permissions:
      actions: read
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: [sbom-image]
    steps:
      - name: Exit on failure
        if: >-
          ${{ contains(fromJson('["failure", "skipped"]'),
          needs.sbom-image.result) }}
        shell: bash
        run: exit 1
      - name: Exit
        shell: bash
        run: exit 0
